<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FeedbackApp</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-subtitle">Join FeedbackApp to share insights and track resolutions</p>
      </div>

      <div id="error-alert" style="display:none; background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger-text); padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.875rem; margin-bottom:1.25rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Aditya Shinde" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="aditya.shinde@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter your password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Account Type</label>
          <select id="role" class="form-select" onchange="toggleAdminPasscode()">
            <option value="user" selected>Standard User (Submit & Edit Feedback)</option>
            <option value="admin">Administrator (Full CRUD Dashboard)</option>
          </select>
        </div>

        <div class="form-group" id="admin-passcode-group" style="display: none; background: #fff1f2; border: 1px solid #fecdd3; padding: 0.85rem; border-radius: var(--radius-md);">
          <label class="form-label" for="adminPasscode" style="color: #9f1239;">Admin Passcode</label>
          <input type="password" id="adminPasscode" class="form-control" placeholder="Enter admin passkey (admin123)">
          <small style="color: #be123c; display: block; margin-top: 0.25rem; font-size: 0.775rem;">
            Default admin passkey for demonstration is <strong>admin123</strong>
          </small>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem;">
          Register Account
        </button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html">Sign In</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    redirectIfAlreadyLoggedIn();

    const form = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const roleSelect = document.getElementById('role');
    const adminPasscodeGroup = document.getElementById('admin-passcode-group');
    const adminPasscodeInput = document.getElementById('adminPasscode');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    function toggleAdminPasscode() {
      if (roleSelect.value === 'admin') {
        adminPasscodeGroup.style.display = 'block';
        adminPasscodeInput.required = true;
      } else {
        adminPasscodeGroup.style.display = 'none';
        adminPasscodeInput.required = false;
      }
    }

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    function hideError() {
      errorAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      if (passwordInput.value !== confirmPasswordInput.value) {
        showError('Passwords do not match. Please verify.');
        return;
      }

      if (passwordInput.value.length < 6) {
        showError('Password must be at least 6 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const payload = {
          name: nameInput.value,
          email: emailInput.value,
          password: passwordInput.value,
          role: roleSelect.value,
          adminPasscode: roleSelect.value === 'admin' ? adminPasscodeInput.value : undefined
        };

        const res = await api.register(payload);
        showToast('Registration successful! Welcome aboard.', 'success');

        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }, 500);
      } catch (err) {
        showError(err.message || 'Registration failed.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Account';
      }
    });
  </script>
</body>
</html>
