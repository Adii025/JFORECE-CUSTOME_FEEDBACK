<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FeedbackApp</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar-container"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to submit and manage your feedbacks</p>
      </div>

      <div id="error-alert" style="display:none; background:var(--danger-bg); border:1px solid var(--danger-border); color:var(--danger-text); padding:0.75rem 1rem; border-radius:var(--radius-md); font-size:0.875rem; margin-bottom:1.25rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="aditya.shinde@example.com or admin@feedback.com" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- 1-Click Quick Demo Login -->
      <div class="quick-accounts-box">
        <p>⚡ Quick Demo 1-Click Login:</p>
        <div class="quick-accounts-buttons">
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="fillAndLogin('user@feedbackapp.com', 'User@123')">
            👤 Demo User
          </button>
          <button type="button" class="btn btn-secondary btn-sm" style="flex:1;" onclick="fillAndLogin('admin@feedbackapp.com', 'Admin@123')">
            🛡️ Admin User
          </button>
        </div>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html">Register here</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfAlreadyLoggedIn();

    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const errorAlert = document.getElementById('error-alert');

    function showError(msg) {
      errorAlert.textContent = msg;
      errorAlert.style.display = 'block';
    }

    function hideError() {
      errorAlert.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const res = await api.login(emailInput.value, passwordInput.value);
        showToast('Login successful! Redirecting...', 'success');
        
        setTimeout(() => {
          if (res.user.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/dashboard.html';
          }
        }, 500);
      } catch (err) {
        showError(err.message || 'Login failed. Please check your credentials.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    async function fillAndLogin(email, password) {
      emailInput.value = email;
      passwordInput.value = password;
      form.dispatchEvent(new Event('submit'));
    }
  </script>
</body>
</html>
