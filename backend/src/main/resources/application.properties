server.port=8081
spring.application.name=feedbackapp-backend

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
# Replace with your PostgreSQL host, port, database name, username and password
spring.datasource.url=jdbc:postgresql://localhost:5432/feedbackapp
spring.datasource.username=postgres
spring.datasource.password=adii@5961
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================================
# Automatically validates and updates database schema without dropping tables
spring.jpa.hibernate.ddl-auto=update

# Shows formatted SQL queries in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Logging configuration
# ===================================================================
logging.level.com.feedbackapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
